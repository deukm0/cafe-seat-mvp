name: 혼잡도 수집 (1시간 주기)

on:
  schedule:
    # 운영 시간: 한국 기준 오전 7시 ~ 자정 (UTC 22:00 ~ 15:00)
    - cron: "0 22-23 * * *"   # 한국 07:00 ~ 08:30
    - cron: "0 0-15 * * *"    # 한국 09:00 ~ 00:30
  workflow_dispatch:              # 수동 실행 허용 (테스트용)

# GitHub은 저장소에 60일 동안 활동이 없으면 예약 작업을 끈다(2026-10-14에 실제로 꺼졌다).
# 마지막 단계에서 이 작업을 스스로 다시 "켜기"로 표시해 그 타이머를 매번 새로 시작한다 — 커밋을 만들지 않는다.
permissions:
  contents: read
  actions: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 혼잡도 수집 실행
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: python scripts/seed_popular_times.py

      - name: 예약 작업이 꺼지지 않게 다시 켜기
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable collect.yml --repo "$GITHUB_REPOSITORY"
