<svg viewBox="0 0 1000 216" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="실패없는 카페 선택 흐름 — 좌석 수를 세고 시간대 혼잡도를 모아 매시간 남은 자리를 추정해 색 핀으로 보여 주고, 사용자가 골라 길찾기로 간다">
  <title>공개 패턴에서 오늘 갈 카페까지</title>

  <line x1="83" y1="34" x2="917" y2="34" stroke="#d8ccb0" stroke-width="3" />
  <circle cx="83" cy="34" r="22" fill="#fbfaf6" stroke="#68604d" stroke-width="2.5" />
  <text x="83" y="39.8" font-size="16" font-weight="700" fill="#68604d" text-anchor="middle">1</text>
  <text x="83" y="104" font-size="20" fill="#24231f" font-weight="600" text-anchor="middle">카페 등록</text>
  <text x="83" y="132" font-size="15" fill="#5f5d55" text-anchor="middle">좌석 수를</text>
  <text x="83" y="154" font-size="15" fill="#5f5d55" text-anchor="middle">현장에서 센다</text>
  <circle cx="250" cy="34" r="22" fill="#fbfaf6" stroke="#68604d" stroke-width="2.5" />
  <text x="250" y="39.8" font-size="16" font-weight="700" fill="#68604d" text-anchor="middle">2</text>
  <text x="250" y="104" font-size="20" fill="#24231f" font-weight="600" text-anchor="middle">패턴 수집</text>
  <text x="250" y="132" font-size="15" fill="#5f5d55" text-anchor="middle">시간대별 혼잡도를</text>
  <text x="250" y="154" font-size="15" fill="#5f5d55" text-anchor="middle">모은다</text>
  <circle cx="417" cy="34" r="22" fill="#fbfaf6" stroke="#68604d" stroke-width="2.5" />
  <text x="417" y="39.8" font-size="16" font-weight="700" fill="#68604d" text-anchor="middle">3</text>
  <text x="417" y="104" font-size="20" fill="#24231f" font-weight="600" text-anchor="middle">매시간 갱신</text>
  <text x="417" y="132" font-size="15" fill="#5f5d55" text-anchor="middle">지금 시각의</text>
  <text x="417" y="154" font-size="15" fill="#5f5d55" text-anchor="middle">혼잡도를 고른다</text>
  <circle cx="583" cy="34" r="22" fill="#fbfaf6" stroke="#68604d" stroke-width="2.5" />
  <text x="583" y="39.8" font-size="16" font-weight="700" fill="#68604d" text-anchor="middle">4</text>
  <text x="583" y="104" font-size="20" fill="#24231f" font-weight="600" text-anchor="middle">남은 자리 추정</text>
  <text x="583" y="132" font-size="15" fill="#5f5d55" text-anchor="middle">좌석 × (1 − 혼잡도)</text>
  <circle cx="750" cy="34" r="22" fill="#fbfaf6" stroke="#68604d" stroke-width="2.5" />
  <text x="750" y="39.8" font-size="16" font-weight="700" fill="#68604d" text-anchor="middle">5</text>
  <text x="750" y="104" font-size="20" fill="#24231f" font-weight="600" text-anchor="middle">지도와 목록</text>
  <text x="750" y="132" font-size="15" fill="#5f5d55" text-anchor="middle">여유 · 보통 · 혼잡</text>
  <text x="750" y="154" font-size="15" fill="#5f5d55" text-anchor="middle">색 핀</text>
  <circle cx="917" cy="34" r="22" fill="#68604d" stroke="#68604d" stroke-width="2.5" />
  <text x="917" y="39.8" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
  <text x="917" y="104" font-size="20" fill="#24231f" font-weight="600" text-anchor="middle">고르고 이동</text>
  <text x="917" y="132" font-size="15" fill="#5f5d55" text-anchor="middle">길찾기로 넘어간다</text>
  <text x="500.0" y="208" font-size="15" fill="#6e6960" text-anchor="middle">실시간 관측이 아니라 공개 방문 패턴에서 나온 추정값이다</text>
</svg>
