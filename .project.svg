<svg viewBox="0 0 350 258" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="실패없는 카페 선택 흐름 — 좌석 실측에서 길찾기까지 여섯 단계">
  <title>공개 패턴에서 오늘 갈 카페까지</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#24231f" />
    </marker>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfaf6" />
      <stop offset="100%" stop-color="#f1ead8" />
    </linearGradient>
  </defs>

  <rect x="10" y="8" width="94" height="76" fill="url(#boxGrad)" stroke="#24231f" stroke-width="1" />
  <text x="18" y="24" font-size="10" letter-spacing="1" fill="#6e6960">1</text>
  <text x="57" y="41" text-anchor="middle" font-size="13" font-weight="600" fill="#24231f">카페 등록</text>
  <text x="57" y="59" text-anchor="middle" font-size="11" fill="#5f5d55">17개 카페</text>
  <text x="57" y="74" text-anchor="middle" font-size="11" fill="#5f5d55">좌석 수 실측</text>

  <rect x="128" y="8" width="94" height="76" fill="url(#boxGrad)" stroke="#24231f" stroke-width="1" />
  <text x="136" y="24" font-size="10" letter-spacing="1" fill="#6e6960">2</text>
  <text x="175" y="41" text-anchor="middle" font-size="13" font-weight="600" fill="#24231f">패턴 수집</text>
  <text x="175" y="59" text-anchor="middle" font-size="11" fill="#5f5d55">요일·시간대</text>
  <text x="175" y="74" text-anchor="middle" font-size="11" fill="#5f5d55">공개 데이터</text>

  <rect x="246" y="8" width="94" height="76" fill="url(#boxGrad)" stroke="#24231f" stroke-width="1" />
  <text x="254" y="24" font-size="10" letter-spacing="1" fill="#6e6960">3</text>
  <text x="293" y="41" text-anchor="middle" font-size="13" font-weight="600" fill="#24231f">매시간 갱신</text>
  <text x="293" y="59" text-anchor="middle" font-size="11" fill="#5f5d55">크론 실행</text>
  <text x="293" y="74" text-anchor="middle" font-size="11" fill="#5f5d55">지금 시각 값</text>

  <rect x="246" y="124" width="94" height="76" fill="url(#boxGrad)" stroke="#24231f" stroke-width="1" />
  <text x="254" y="140" font-size="10" letter-spacing="1" fill="#6e6960">4</text>
  <text x="293" y="157" text-anchor="middle" font-size="13" font-weight="600" fill="#24231f">자리 추정</text>
  <text x="293" y="175" text-anchor="middle" font-size="11" fill="#5f5d55">총 좌석 × 여유</text>
  <text x="293" y="190" text-anchor="middle" font-size="11" fill="#5f5d55">3단계 판정</text>

  <rect x="128" y="124" width="94" height="76" fill="url(#boxGrad)" stroke="#24231f" stroke-width="1" />
  <text x="136" y="140" font-size="10" letter-spacing="1" fill="#6e6960">5</text>
  <text x="175" y="157" text-anchor="middle" font-size="13" font-weight="600" fill="#24231f">지도·목록</text>
  <text x="175" y="175" text-anchor="middle" font-size="11" fill="#5f5d55">실시간 구독</text>
  <text x="175" y="190" text-anchor="middle" font-size="11" fill="#5f5d55">색상 핀</text>

  <rect x="10" y="124" width="94" height="76" fill="url(#boxGrad)" stroke="#24231f" stroke-width="1" />
  <text x="18" y="140" font-size="10" letter-spacing="1" fill="#6e6960">6</text>
  <text x="57" y="157" text-anchor="middle" font-size="13" font-weight="600" fill="#24231f">고르고 이동</text>
  <text x="57" y="175" text-anchor="middle" font-size="11" fill="#5f5d55">여유로운 곳</text>
  <text x="57" y="190" text-anchor="middle" font-size="11" fill="#5f5d55">길찾기</text>

  <line x1="104" y1="46" x2="126" y2="46" stroke="#24231f" stroke-width="1" marker-end="url(#arrow)" />
  <line x1="222" y1="46" x2="244" y2="46" stroke="#24231f" stroke-width="1" marker-end="url(#arrow)" />
  <line x1="293" y1="84" x2="293" y2="122" stroke="#24231f" stroke-width="1" marker-end="url(#arrow)" />
  <line x1="244" y1="162" x2="224" y2="162" stroke="#24231f" stroke-width="1" marker-end="url(#arrow)" />
  <line x1="126" y1="162" x2="106" y2="162" stroke="#24231f" stroke-width="1" marker-end="url(#arrow)" />

  <text x="175" y="228" text-anchor="middle" font-size="11" fill="#6e6960">실측이 아니라 공개 패턴 기반 추정값이다</text>
  <text x="175" y="246" text-anchor="middle" font-size="11" fill="#6e6960">서버 없이 크론으로 돌아 지금도 갱신된다</text>
</svg>
