<svg viewBox="0 0 350 368" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="실패없는 카페 선택 판단 흐름 — 좌석 수와 시간대 혼잡도로 남은 자리를 계산해 색 핀으로 보여주고 사용자가 고른다">
  <title>공개 패턴에서 오늘 갈 카페까지</title>
  <defs>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8e75" />
    </marker>
  </defs>

  <rect x="0" y="0" width="350" height="100" rx="14" fill="#ffffff" stroke="#e2dac8" stroke-width="1" />
  <text x="14" y="22" font-size="10" fill="#6e6960" font-weight="700" letter-spacing="1.5">입력</text>
  <text x="14" y="50" font-size="15" fill="#24231f" font-weight="600">좌석 수</text>
  <text x="14" y="69" font-size="12" fill="#5f5d55">17곳을 현장에서 셌다</text>
  <text x="186" y="50" font-size="15" fill="#24231f" font-weight="600">시간대 혼잡도</text>
  <text x="186" y="69" font-size="12" fill="#5f5d55">공개 방문 패턴, 매시간</text>
  <line x1="172" y1="38" x2="172" y2="86" stroke="#e2dac8" stroke-width="1" />
  <rect x="0" y="126" width="350" height="86" rx="14" fill="#68604d" />
  <text x="14" y="148" font-size="10" fill="#c9cfb3" font-weight="700" letter-spacing="1.5">판단</text>
  <text x="14" y="176" font-size="17" fill="#ffffff" font-weight="600">남은 자리 계산</text>
  <text x="14" y="195" font-size="12" fill="#efe8d6">총 좌석 × (1 − 혼잡도)</text>
  <rect x="0" y="238" width="160" height="100" rx="14" fill="#f1ead8" />
  <text x="14" y="260" font-size="10" fill="#6e6960" font-weight="700" letter-spacing="1.5">결과</text>
  <text x="14" y="288" font-size="15" fill="#24231f" font-weight="600">색 핀</text>
  <text x="14" y="307" font-size="12" fill="#5f5d55">여유 · 보통 · 혼잡</text>
  <rect x="190" y="238" width="160" height="100" rx="14" fill="#f1ead8" />
  <text x="204" y="260" font-size="10" fill="#6e6960" font-weight="700" letter-spacing="1.5">사용자</text>
  <text x="204" y="288" font-size="15" fill="#24231f" font-weight="600">고르고 이동</text>
  <text x="204" y="307" font-size="12" fill="#5f5d55">여유로운 곳으로</text>
  <text x="204" y="323" font-size="12" fill="#5f5d55">길찾기</text>
  <line x1="175" y1="104" x2="175" y2="121" stroke="#8a8e75" stroke-width="1.5" marker-end="url(#flow-arrow)" />
  <line x1="175" y1="216" x2="175" y2="233" stroke="#8a8e75" stroke-width="1.5" marker-end="url(#flow-arrow)" />
  <line x1="164" y1="288.0" x2="185" y2="288.0" stroke="#8a8e75" stroke-width="1.5" marker-end="url(#flow-arrow)" />
  <text x="175" y="364" font-size="12" fill="#6e6960" text-anchor="middle">실시간 관측이 아니라 공개 방문 패턴에서 나온 추정값이다</text>
</svg>
