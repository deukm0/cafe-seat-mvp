<svg viewBox="0 0 350 419" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="실패없는 카페 선택 흐름 — 좌석 수를 세고 시간대 혼잡도를 모아 매시간 남은 자리를 추정해 색 핀으로 보여 주고, 사용자가 골라 길찾기로 간다">
  <title>공개 패턴에서 오늘 갈 카페까지</title>

  <line x1="17" y1="17" x2="17" y2="347" stroke="#d8ccb0" stroke-width="2.5" />
  <circle cx="17" cy="17" r="15" fill="#fbfaf6" stroke="#68604d" stroke-width="2.5" />
  <text x="17" y="21.3" font-size="12" font-weight="700" fill="#68604d" text-anchor="middle">1</text>
  <text x="48" y="14" font-size="15" fill="#24231f" font-weight="600">카페 등록</text>
  <text x="48" y="33" font-size="12.5" fill="#5f5d55">좌석 수를 현장에서 센다</text>
  <circle cx="17" cy="83" r="15" fill="#fbfaf6" stroke="#68604d" stroke-width="2.5" />
  <text x="17" y="87.3" font-size="12" font-weight="700" fill="#68604d" text-anchor="middle">2</text>
  <text x="48" y="80" font-size="15" fill="#24231f" font-weight="600">패턴 수집</text>
  <text x="48" y="99" font-size="12.5" fill="#5f5d55">시간대별 혼잡도를 모은다</text>
  <circle cx="17" cy="149" r="15" fill="#fbfaf6" stroke="#68604d" stroke-width="2.5" />
  <text x="17" y="153.3" font-size="12" font-weight="700" fill="#68604d" text-anchor="middle">3</text>
  <text x="48" y="146" font-size="15" fill="#24231f" font-weight="600">매시간 갱신</text>
  <text x="48" y="165" font-size="12.5" fill="#5f5d55">지금 시각의 혼잡도를 고른다</text>
  <circle cx="17" cy="215" r="15" fill="#fbfaf6" stroke="#68604d" stroke-width="2.5" />
  <text x="17" y="219.3" font-size="12" font-weight="700" fill="#68604d" text-anchor="middle">4</text>
  <text x="48" y="212" font-size="15" fill="#24231f" font-weight="600">남은 자리 추정</text>
  <text x="48" y="231" font-size="12.5" fill="#5f5d55">좌석 × (1 − 혼잡도)</text>
  <circle cx="17" cy="281" r="15" fill="#fbfaf6" stroke="#68604d" stroke-width="2.5" />
  <text x="17" y="285.3" font-size="12" font-weight="700" fill="#68604d" text-anchor="middle">5</text>
  <text x="48" y="278" font-size="15" fill="#24231f" font-weight="600">지도와 목록</text>
  <text x="48" y="297" font-size="12.5" fill="#5f5d55">여유 · 보통 · 혼잡 색 핀</text>
  <circle cx="17" cy="347" r="15" fill="#68604d" stroke="#68604d" stroke-width="2.5" />
  <text x="17" y="351.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
  <text x="48" y="344" font-size="15" fill="#24231f" font-weight="600">고르고 이동</text>
  <text x="48" y="363" font-size="12.5" fill="#5f5d55">길찾기로 넘어간다</text>
  <text x="0" y="396" font-size="12" fill="#6e6960">실시간 관측이 아니라 공개 방문 패턴에서</text>
  <text x="0" y="413" font-size="12" fill="#6e6960">나온 추정값이다</text>
</svg>
